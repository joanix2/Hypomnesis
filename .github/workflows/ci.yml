name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install symbolic distribution only
        run: pip install '.[dev]'
      - name: Verify isolation
        run: |
          python -c "from importlib.util import find_spec; assert all(find_spec(m) is None for m in ['hypomnesis_codegen', 'ollama', 'sklearn', 'jinja2', 'matplotlib', 'scipy'])"
          hypomnesis check demo/examples/basics/certifiable.hyp
      - name: Test symbolic engine without codegen
        run: pytest tests --ignore=tests/optional
      - name: Check symbolic types without codegen
        run: pyright

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install '.[dev,sklearn]' ./packages/codegen
      - name: Linters (pre-commit)
        # lean-build s'exécute dans le job « proofs »
        run: SKIP=lean-build pre-commit run --all-files --show-diff-on-failure
      - name: Test
        run: pytest tests packages/codegen/tests
      - name: Run examples
        run: |
          hypomnesis run demo/examples/basics/tour.hyp
          hypomnesis run demo/examples/mechanics/units.hyp demo/examples/mechanics/plate.hyp

  proofs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build proofs
        run: lake build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Certificate checker on the certifiable example
        run: |
          lake build hypomnesis-check
          pip install -e '..[dev]'
          hypomnesis check ../demo/examples/basics/certifiable.hyp --emit-certificate cert.json --certify --checker .lake/build/bin/hypomnesis-check
      - name: Certify every example through checker and CLI (no exemptions)
        run: pytest ../tests/integration/test_lean_checker.py
      - name: Compare at least 500 typed programs with the real Lean evaluator
        env:
          HYPOMNESIS_REQUIRE_LEAN: "1"
        run: pytest ../tests/differential --hypothesis-show-statistics
      - name: Reject sorry
        run: "! grep -rnwE 'sorry|admit' Hypomnesis"
      - name: Audit axioms
        run: |
          lake env lean Audit.lean | tee axioms.txt
          ! grep -E 'sorryAx' axioms.txt
          ! grep -oE 'axioms: \[[^]]*\]' axioms.txt | tr -d '[]' | sed 's/axioms: //' \
            | tr ',' '\n' | sed 's/ //g' | grep -vE '^(propext|Quot.sound|Classical.choice)?$'
