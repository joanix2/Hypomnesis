name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: pyright
      - name: Test
        run: pytest
      - name: Kanban board
        run: python kanban/board.py --check
      - name: Run examples
        run: |
          hypomnesis run examples/basics/tour.hyp
          hypomnesis run examples/mechanics/units.hyp examples/mechanics/plate.hyp

  proofs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build proofs
        run: lake build
      - name: Reject sorry
        run: "! grep -rnwE 'sorry|admit' Hypomnesis"
      - name: Audit axioms
        run: |
          lake env lean Audit.lean | tee axioms.txt
          ! grep -E 'sorryAx' axioms.txt
          ! grep -oE 'axioms: \[[^]]*\]' axioms.txt | tr -d '[]' | sed 's/axioms: //' \
            | tr ',' '\n' | sed 's/ //g' | grep -vE '^(propext|Quot.sound|Classical.choice)?$'
