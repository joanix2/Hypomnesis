name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Linters (pre-commit)
        # lean-build s'exécute dans le job « proofs »
        run: SKIP=lean-build pre-commit run --all-files --show-diff-on-failure
      - name: Test
        run: pytest
      - name: Run examples
        run: |
          hypomnesis run demo/examples/basics/tour.hyp
          hypomnesis run demo/examples/mechanics/units.hyp demo/examples/mechanics/plate.hyp

  proofs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build proofs
        run: lake build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Certificate checker on the certifiable example
        run: |
          lake build hypomnesis-check
          pip install -e ..
          hypomnesis check ../demo/examples/basics/certifiable.hyp --emit-certificate cert.json
          .lake/build/bin/hypomnesis-check check cert.json
      - name: Reject sorry
        run: "! grep -rnwE 'sorry|admit' Hypomnesis"
      - name: Audit axioms
        run: |
          lake env lean Audit.lean | tee axioms.txt
          ! grep -E 'sorryAx' axioms.txt
          ! grep -oE 'axioms: \[[^]]*\]' axioms.txt | tr -d '[]' | sed 's/axioms: //' \
            | tr ',' '\n' | sed 's/ //g' | grep -vE '^(propext|Quot.sound|Classical.choice)?$'
