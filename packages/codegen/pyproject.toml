[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hypomnesis-codegen"
version = "0.1.0"
description = "Natural-language program generation and LLM benchmarks for Hypomnesis."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "hypomnesis>=0.1.0,<0.2",
  "typer>=0.12",
  "jinja2>=3.1",
  "scikit-learn>=1.5",
  "ollama>=0.3",
  "matplotlib>=3.8",
  "scipy>=1.11",
]

[project.scripts]
hypomnesis-codegen = "hypomnesis_codegen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hypomnesis_codegen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
