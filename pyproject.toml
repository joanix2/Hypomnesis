[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hypomnesis"
version = "0.1.0"
description = "A language for programmable knowledge and reasoning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Joan DUSSAULD" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "lark>=1.2",
  "jsonschema[format-nongpl]>=4.21",
  "referencing>=0.35",
  "z3-solver>=4.12",
  "typer>=0.12",
  "networkx>=3.2",
  "semantic-version>=2.10,<3",
  "resolvelib>=1.2,<2",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
telemetry = [
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]
sklearn = [
  "scikit-learn>=1.4",
]
lsp = [
  "pygls>=2.0,<3",
]
dev = [
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "pygls>=2.0,<3",
  "pyyaml>=6",
  "pytest>=8",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "pre-commit>=3.7",
]

[project.scripts]
hypomnesis = "hypomnesis.cli:main"
hypomnesis-lsp = "hypomnesis.lsp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hypomnesis"]

[tool.hatch.build.targets.sdist]
exclude = ["/packages/codegen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "packages/codegen/src", "packages/codegen/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E731",  # the interpreter compiles IR nodes to lambdas on purpose
  "N802",  # _infer_<NodeName> dispatch methods
]

# Typographie française des dimensions (« 120 × 80 mm ») : voulue, pas une confusion.
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"packages/codegen/tests/**" = ["B011"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
